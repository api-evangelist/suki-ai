  name: Suki Platform REST API
  description: The Suki Platform REST API and SDKs let healthcare technology partners embed Suki's ambient
    clinical documentation, dictation, voice command, and form-filling capabilities into EHRs, telehealth
    platforms, care management systems, and revenue-cycle tools. Authentication is partner-issued; the
    platform supports REST APIs, a Web SDK, a Headless Web SDK (React 18+ beta), a native iOS Mobile SDK
    (Android coming), and an embedded Dictation SDK (iframe beta).
