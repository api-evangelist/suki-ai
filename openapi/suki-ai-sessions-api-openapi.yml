openapi: 3.2.0
info:
  title: Suki Ai Sessions API
  version: 1.0.0
  contact:
    name: Suki for Partners
    url: https://developer.suki.ai
  description: 'Operations tagged Sessions across 2 of this provider''s published API definitions: suki-ai-ambient-api-openapi.yml, suki-ai-form-filling-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://sdp.suki-stage.com/api/v1
  description: Suki Speech Service staging environment
security:
- SdpSukiToken: []
tags:
- name: Sessions
  description: Ambient Session Lifecycle
paths:
  /ambient/sessions:
    post:
      tags:
      - Sessions
      summary: Create Ambient Session
      description: Create a new ambient documentation session for a provider and encounter.
      operationId: createAmbientSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmbientSessionCreate'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmbientSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
    servers:
    - url: https://sdp.suki-stage.com/api/v1
      description: Suki Speech Service staging environment
  /ambient/sessions/{sessionId}/context:
    post:
      tags:
      - Sessions
      summary: Seed Session Context
      operationId: seedAmbientSessionContext
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionContext'
      responses:
        '200':
          description: Context applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
    patch:
      tags:
      - Sessions
      summary: Update Session Context
      operationId: updateAmbientSessionContext
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionContext'
      responses:
        '200':
          description: Context updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
    servers:
    - url: https://sdp.suki-stage.com/api/v1
      description: Suki Speech Service staging environment
  /ambient/sessions/{sessionId}/end:
    post:
      tags:
      - Sessions
      summary: End Ambient Session
      operationId: endAmbientSession
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session ended; note generation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmbientSession'
    servers:
    - url: https://sdp.suki-stage.com/api/v1
      description: Suki Speech Service staging environment
  /ambient/sessions/{sessionId}/status:
    get:
      tags:
      - Sessions
      summary: Get Ambient Session Status
      operationId: getAmbientSessionStatus
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Current session and note generation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionStatus'
    servers:
    - url: https://sdp.suki-stage.com/api/v1
      description: Suki Speech Service staging environment
  /form-filling/sessions:
    post:
      tags:
      - Sessions
      summary: Create Form Filling Session
      operationId: createFormFillingSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormFillingSessionCreate'
      responses:
        '201':
          description: Session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormFillingSession'
    servers:
    - url: https://sdp.suki-stage.com/api/v1
      description: Suki Speech Service staging environment
  /form-filling/sessions/{sessionId}/context:
    post:
      tags:
      - Sessions
      summary: Seed Form Filling Context
      operationId: seedFormFillingContext
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormFillingContext'
      responses:
        '200':
          description: Context applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormFillingContext'
    patch:
      tags:
      - Sessions
      summary: Update Form Filling Context
      operationId: updateFormFillingContext
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormFillingContext'
      responses:
        '200':
          description: Context updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormFillingContext'
    servers:
    - url: https://sdp.suki-stage.com/api/v1
      description: Suki Speech Service staging environment
  /form-filling/sessions/{sessionId}/end:
    post:
      tags:
      - Sessions
      summary: End Form Filling Session
      operationId: endFormFillingSession
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session ended; structured data queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormFillingSession'
    servers:
    - url: https://sdp.suki-stage.com/api/v1
      description: Suki Speech Service staging environment
  /form-filling/sessions/{sessionId}/status:
    get:
      tags:
      - Sessions
      summary: Get Form Filling Status
      operationId: getFormFillingStatus
      parameters:
      - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Processing status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormFillingStatus'
    servers:
    - url: https://sdp.suki-stage.com/api/v1
      description: Suki Speech Service staging environment
components:
  schemas:
    AmbientSession:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        providerId:
          type: string
        encounterId:
          type: string
        status:
          type: string
          enum:
          - created
          - recording
          - ended
          - processing
          - complete
          - failed
        createdAt:
          type: string
          format: date-time
        audioWebsocketUrl:
          type: string
          format: uri
    SessionStatus:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
        eta:
          type: integer
          description: Estimated seconds until note is ready
    AmbientSessionCreate:
      type: object
      required:
      - providerId
      - encounterId
      properties:
        providerId:
          type: string
        encounterId:
          type: string
        specialty:
          type: string
          example: family-medicine
        encounterType:
          type: string
          example: office-visit
        visitType:
          type: string
          example: new-patient
        languageCode:
          type: string
          example: en-US
        problemBasedCharting:
          type: boolean
          default: true
    SessionContext:
      type: object
      properties:
        patient:
          type: object
          properties:
            mrn:
              type: string
            sex:
              type: string
            birthDate:
              type: string
              format: date
            problems:
              type: array
              items:
                type: string
        priorNote:
          type: string
        loincSections:
          type: array
          items:
            type: string
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
    FormFillingStatus:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        status:
          type: string
        progress:
          type: integer
          minimum: 0
          maximum: 100
    FormFillingSessionCreate:
      type: object
      required:
      - providerId
      - templateId
      properties:
        providerId:
          type: string
        templateId:
          type: string
        languageCode:
          type: string
          example: en-US
    FormFillingContext:
      type: object
      properties:
        patient:
          type: object
          properties:
            mrn:
              type: string
            sex:
              type: string
            birthDate:
              type: string
              format: date
        priorAnswers:
          type: object
          additionalProperties: true
    FormFillingSession:
      type: object
      properties:
        sessionId:
          type: string
          format: uuid
        templateId:
          type: string
        status:
          type: string
          enum:
          - created
          - recording
          - ended
          - processing
          - complete
        audioWebsocketUrl:
          type: string
          format: uri
        createdAt:
          type: string
          format: date-time
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing or invalid sdp_suki_token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    SdpSukiToken:
      type: apiKey
      in: header
      name: sdp_suki_token
x-refined-from:
- suki-ai-ambient-api-openapi.yml
- suki-ai-form-filling-api-openapi.yml
