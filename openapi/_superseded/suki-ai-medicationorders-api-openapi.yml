openapi: 3.2.0
info:
  title: Suki Ambient Auth Medication Orders API
  description: 'REST endpoints for Suki Speech Service ambient clinical documentation.

    Partners create an ambient session, seed it with patient and encounter

    context, stream audio over a separate WebSocket channel, end the session,

    and then retrieve the generated clinical note, transcript, structured data,

    and recording. Pair with the WebSocket audio endpoint

    `wss://sdp.suki-stage.com/api/v1/ambient/sessions/{sessionId}/audio` and the

    webhook callback POSTed to the partner endpoint on session completion.

    '
  version: 1.0.0
  contact:
    name: Suki for Partners
    url: https://developer.suki.ai
servers:
- url: https://sdp.suki-stage.com/api/v1
  description: Suki Speech Service staging environment
security:
- SdpSukiToken: []
tags:
- name: MedicationOrders
  description: Medication Ordering Metadata
paths:
  /info/medication-orders:
    get:
      tags:
      - MedicationOrders
      summary: List Medication Order Metadata
      operationId: listMedicationOrders
      responses:
        '200':
          description: Medication order metadata
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicationOrderMeta'
  /info/orders-coding-systems:
    get:
      tags:
      - MedicationOrders
      summary: List Order Coding Systems
      operationId: listOrderCodingSystems
      responses:
        '200':
          description: Supported coding systems for medication orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CodeLabel'
  /info/orders-dosage-units:
    get:
      tags:
      - MedicationOrders
      summary: List Dosage Units
      operationId: listOrderDosageUnits
      responses:
        '200':
          description: Supported dosage units for orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CodeLabel'
components:
  schemas:
    CodeLabel:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        system:
          type: string
    MedicationOrderMeta:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        rxnorm:
          type: string
        route:
          type: string
        defaultDosageUnit:
          type: string
  securitySchemes:
    SdpSukiToken:
      type: apiKey
      in: header
      name: sdp_suki_token
